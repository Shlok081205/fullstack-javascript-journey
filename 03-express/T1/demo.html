<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node.js Static Page</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f2f5;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Success!</h1>
      <p>This HTML file was served by your <b>Node.js</b> server.</p>
      <p>Current Time: <span id="time"></span></p>
    </div>

    <script>
      // Just a little JS to show the page is active
      document.getElementById("time").innerText =
        new Date().toLocaleTimeString();
    </script>
  </body>
</html>
