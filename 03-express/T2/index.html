<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>File Upload</title>
  </head>
  <body>
    <form action="/uploadfile" method="POST">
      <label>Select PDF (Max 10MB):</label>
      <input type="file" name="LJU" accept=".pdf" required />
      <input type="submit" value="Upload File" />
    </form>
  </body>
</html>
