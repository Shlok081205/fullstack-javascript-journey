<!--Write a JSON object which contains array of three objects each object contains 2 properties name and age .Now sort the array by age in descending order in console-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      let obj = {
        name_age: [
          { name: "Shlok", age: 19 },
          { name: "Shlok Patel", age: 20 },
          { name: "Shlok Chirag Patel", age: 21 },
        ],
      };

      function sorting() {
        let arr = obj.name_age;
        let n = arr.length;

        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n - i - 1; j++) {
            if (arr[j].age < arr[j + 1].age) {
              let temp = arr[j];
              arr[j] = arr[j + 1];
              arr[j + 1] = temp;
            }
          }
        }

        console.log("Sorted Array (Descending):", arr);
      }

      sorting();
    </script>
  </head>
  <body></body>
</html>
